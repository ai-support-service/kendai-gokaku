        if(r.done){var u=new Uint8Array(got),o=0;chunks.forEach(function(c){u.set(c,o);o+=c.length;});return u.buffer;}
        chunks.push(r.value);got+=r.value.length;
        if(waiting){var p=total?Math.min(99,Math.round(got/total*100)):null;msg("読み込み中…"+(p!=null?p+"%":Math.round(got/1048576)+"MB"),p);
          $("lkP2").textContent="はじめと、アプリを新しくした後だけ時間がかかります（約"+(GZ?"8":"10")+"MB）";}
        return pump();});})();
    });
    dl.catch(function(){dl=null;});
    return dl;
  }
  var waiting=false;
  function deriveKey(pw){return crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]).then(function(km){
    return crypto.subtle.deriveKey({name:"PBKDF2",salt:bin(SALT),iterations:IT,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);});}
  function decrypt(buf,key){
    return crypto.subtle.decrypt({name:"AES-GCM",iv:bin(GZ?IVGZ:IVRAW)},key,buf).then(function(pt){
      if(!GZ)return new TextDecoder().decode(pt);
      var s=new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"));
      return new Response(s).arrayBuffer().then(function(b){return new TextDecoder().decode(b);});
    });
  }
  function write(html){
    msg("開いています…",100);
    setTimeout(function(){document.open();document.write(html);document.close();},30);
  }
  function showForm(m,err){$("lkF").hidden=false;msg(m||"合言葉を入れてください（最初の1回だけ）",0);$("lkE").textContent=err||"";$("lkB").disabled=false;$("lkB").textContent="開く";try{$("lkP").focus();}catch(e){}}
  function fail(e,saved){
    if(e&&e.name==="OperationError"){if(saved){put(null);showForm("合言葉が変わりました。新しい合言葉を入れてください","");}else showForm(null,"合言葉がちがいます");return;}
    showForm("読み込めませんでした。電波のよい所で、もう一度「開く」を押してください",String(e&&e.message||e||""));
    if(saved){$("lkP").value=saved;}
  }
  function open(pw,saved){
    waiting=true;$("lkF").hidden=true;$("lkE").textContent="";msg("読み込み中…",5);
    return deriveKey(pw).then(function(key){
      return download().then(function(buf){msg("鍵をあけています…",100);return decrypt(buf,key);});
    }).then(function(html){
      put(pw);msg("開いています…",100);Promise.race([cachePut({ver:VER,html:html}),new Promise(function(ok){setTimeout(ok,5000);})]).then(function(){write(html);});
    }).catch(function(e){waiting=false;fail(e,saved);});
  }
  if(!(window.crypto&&crypto.subtle)){msg("このブラウザでは開けません（SafariかChromeで開いてください）");return;}
  $("lkF").addEventListener("submit",function(ev){ev.preventDefault();var pw=norm($("lkP").value);if(!pw)return;$("lkB").disabled=true;$("lkB").textContent="開いています…";open(pw,null);});
  // いちばん新しい版を毎回たしかめる（ホーム画面のアプリが古い入口を覚えていても、新しい版に入れ替わる）
  function latest(){
    var t=new Promise(function(ok){setTimeout(function(){ok(null);},4000);});
    var f=fetch("ver.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():null;}).then(function(v){return v&&v.VER&&v.SALT?v:null;}).catch(function(){return null;});
    return Promise.race([f,t]);
  }
  function use(v){if(v&&v.VER!==VER){VER=v.VER;SALT=v.SALT;IVGZ=v.IVGZ;IVRAW=v.IVRAW;dl=null;}}
  var s=get();
  if(s){
    cacheGet().then(function(c){
      latest().then(function(v){
        use(v);
        // 版が同じ、または電波がなくて確かめられないときは、端末の中の控えからすぐ開く
        if(c&&c.html&&(c.ver===VER||!v)){write(c.html);}else{download();open(s,s);}
      });
    });
  }else{
    latest().then(function(v){use(v);download();showForm();});
  }
})();
</script>
